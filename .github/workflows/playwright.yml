name: Nightly QA Dashboard

on:
  push:
    branches:
      - auto_heal_framework # This makes the workflow run immediately when you push to this branch
  schedule:
    - cron: '0 2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout gh-pages (Get Historical Data)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: old-reports
          continue-on-error: true 

      - name: 📥 Checkout Main Code
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🔄 Restore 30-Day History
        run: |
          cp old-reports/dashboard-history.js main-repo/utils/dashboard-history.js || echo "No previous history found, starting fresh!"

      - name: 📦 Install Dependencies
        working-directory: ./main-repo
        run: npm install

      - name: 🌐 Install Playwright Browsers
        working-directory: ./main-repo
        run: npx playwright install --with-deps

      - name: 🔐 Generate .env file
        working-directory: ./main-repo
        env:
          FULL_ENV_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: echo "$FULL_ENV_CONTENT" > .env

      # UPDATED STEP: Only runs the 3 forms you specified
      - name: 🚀 Run Playwright Tests (3 Forms Only)
        working-directory: ./main-repo
        run: npx playwright test -g "2527|2704|3005"
        continue-on-error: true 

      - name: 📊 Generate Custom HTML Dashboard
        working-directory: ./main-repo
        run: npx ts-node utils/DashboardGenerator.ts

      - name: 📦 Install Allure Commandline
        run: npm install -g allure-commandline

      - name: 📈 Generate Allure Report
        working-directory: ./main-repo
        run: allure generate allure-results --clean -o reports/allure

      - name: 🌍 Publish Dashboards to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./main-repo/reports