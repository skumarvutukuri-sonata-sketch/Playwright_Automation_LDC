name: Nightly QA Dashboard

on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically every day at 2:00 AM UTC
  workflow_dispatch: # Creates a button in GitHub so you can run it manually anytime

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout gh-pages (Get Historical Data)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: old-reports
          continue-on-error: true # It's okay if this fails on the very first run!

      - name: 📥 Checkout Main Code
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🔄 Restore 30-Day History
        run: |
          # Copy previous history into the utils folder (our Safe Zone) so the generator can find it
          cp old-reports/dashboard-history.js main-repo/utils/dashboard-history.js || echo "No previous history found, starting fresh!"

      - name: 📦 Install Dependencies
        working-directory: ./main-repo
        run: npm install

      - name: 🌐 Install Playwright Browsers
        working-directory: ./main-repo
        run: npx playwright install --with-deps

      - name: 🚀 Run Playwright Tests
        working-directory: ./main-repo
        run: npx playwright test
        continue-on-error: true # Ensures the pipeline keeps going even if tests fail!

      - name: 📊 Generate Custom HTML Dashboard
        working-directory: ./main-repo
        run: npx ts-node utils/DashboardGenerator.ts

      - name: 📦 Install Allure Commandline
        run: npm install -g allure-commandline

      - name: 📈 Generate Allure Report
        working-directory: ./main-repo
        run: allure generate allure-results --clean -o reports/allure

      - name: 🌍 Publish Dashboards to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./main-repo/reports